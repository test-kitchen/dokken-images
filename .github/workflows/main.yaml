name: build-and-push

"on":
  pull_request:
  push:
    branches: [main]
  schedule: [cron: "0 0 * * *"]

jobs:
  buildx-arm64-amd64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os-with-arm64:
          - "almalinux-8"
          - "almalinux-9"
          - "almalinux-10"
          - "amazonlinux-2"
          - "amazonlinux-2023"
          - "centos-stream-9"
          - "centos-stream-10"
          - "debian-12"
          - "debian-13"
          - "debian-14"
          - "fedora-43"
          - "fedora-44"
          - "fedora-45"
          - "fedora-latest"
          - "opensuse-leap-16.0"
          - "sles-15"
          - "sles-16"
          - "rockylinux-8"
          - "rockylinux-9"
          - "rockylinux-10"
          - "oraclelinux-7"
          - "oraclelinux-8"
          - "oraclelinux-9"
          - "oraclelinux-10"
          - "ubuntu-18.04"
          - "ubuntu-20.04"
          - "ubuntu-22.04"
          - "ubuntu-24.04"
          - "ubuntu-26.04"
          - "ubuntu-26.10"
    env:
      # Empty on fork and Dependabot PRs, which can't read Actions secrets
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Log in before setting up Buildx so the buildkit and base image pulls
      # use our Docker Hub account rather than the runner's built-in one
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: env.DOCKER_USERNAME != ''

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/test-kitchen/dokken/${{ matrix.os-with-arm64 }}
            dokken/${{ matrix.os-with-arm64 }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Every job uploads a build record artifact; keep them only long
          # enough to debug a recent failure
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
        with:
          sbom: true
          provenance: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          file: ./${{ matrix.os-with-arm64 }}/Dockerfile
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, which stopped the nightly rebuilds in August 2026. Re-enabling
  # the workflow from the nightly run is expected to reset that timer, but
  # that is unconfirmed: if the schedule is still disabled after 60 days
  # without commits, this job does not help and can be removed.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the nightly schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/main.yaml/enable"
